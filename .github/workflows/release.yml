name: Release assets

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux-x64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Assemble production tree
        run: |
          pnpm deploy --filter moonanbot --prod release/stage
          tar -C release/stage -czf "release/MoonanBot-linux-x64-${GITHUB_REF_NAME}.tar.gz" .
          cd release
          sha256sum "MoonanBot-linux-x64-${GITHUB_REF_NAME}.tar.gz" > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          body_path: RELEASE_NOTES.md
          files: |
            release/MoonanBot-linux-x64-${{ github.ref_name }}.tar.gz
            release/SHA256SUMS
